# Releases the Go CLI: `goreleaser release --clean` from cli/ on a v* tag.
# Try it without publishing: goreleaser release --snapshot --clean
# Publishing needs the repos and tokens in docs/operations.md ("Release the CLI").
version: 2
project_name: wallpy

git:
  # The Python CLI's archive tag (python-v2.25.0) isn't a version of this CLI.
  ignore_tags: ["python-*"]

before:
  hooks:
    - go mod tidy
    - go test ./...
    # Shell completions and the man page ship inside every archive.
    - cp ../LICENSE LICENSE # the repo's licence, inside cli/ for the archives
    - sh -c 'rm -rf completions manpages && mkdir completions manpages'
    - sh -c 'go run ./cmd/wallpy completion bash > completions/wallpy.bash'
    - sh -c 'go run ./cmd/wallpy completion zsh > completions/_wallpy'
    - sh -c 'go run ./cmd/wallpy completion fish > completions/wallpy.fish'
    - sh -c 'go run ./cmd/wallpy man | gzip -c > manpages/wallpy.1.gz'

builds:
  - main: ./cmd/wallpy
    binary: wallpy
    env: [CGO_ENABLED=0] # purego reaches AppKit without cgo, so every target cross-compiles
    goos: [darwin, linux, windows, freebsd]
    goarch: [amd64, arm64]
    ignore:
      - { goos: freebsd, goarch: arm64 }
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]

archives:
  - formats: [tar.gz]
    format_overrides:
      - { goos: windows, formats: [zip] }
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - completions/*
      - manpages/*

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: git
  filters:
    include: ["^feat\\(cli\\)", "^fix\\(cli\\)"]

nfpms:
  - package_name: wallpy
    homepage: https://wallpy.siphyshu.me
    maintainer: Jaiyank Saxena <siphyshu@gmail.com>
    description: Dynamic wallpapers for your desktop.
    license: MIT
    formats: [deb, rpm, apk]
    contents:
      - { src: ./completions/wallpy.bash, dst: /usr/share/bash-completion/completions/wallpy }
      - { src: ./completions/_wallpy, dst: /usr/share/zsh/vendor-completions/_wallpy }
      - { src: ./completions/wallpy.fish, dst: /usr/share/fish/vendor_completions.d/wallpy.fish }
      - { src: ./manpages/wallpy.1.gz, dst: /usr/share/man/man1/wallpy.1.gz }

homebrew_casks:
  - repository: { owner: siphyshu, name: homebrew-tap, token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}" }
    homepage: https://wallpy.siphyshu.me
    description: Dynamic wallpapers for your desktop.
    binaries: [wallpy]
    completions:
      bash: completions/wallpy.bash
      zsh: completions/_wallpy
      fish: completions/wallpy.fish
    manpages: [manpages/wallpy.1.gz]
    hooks:
      post:
        # Unsigned for now: clear the quarantine flag so macOS runs it.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/wallpy"]
          end

scoops:
  - repository: { owner: siphyshu, name: scoop-bucket, token: "{{ .Env.SCOOP_BUCKET_GITHUB_TOKEN }}" }
    homepage: https://wallpy.siphyshu.me
    description: Dynamic wallpapers for your desktop.
    license: MIT

winget:
  - name: Wallpy
    publisher: siphyshu
    short_description: Dynamic wallpapers for your desktop.
    license: MIT
    homepage: https://wallpy.siphyshu.me
    publisher_url: https://github.com/siphyshu
    package_identifier: siphyshu.Wallpy
    repository:
      owner: siphyshu
      name: winget-pkgs # a fork of microsoft/winget-pkgs
      token: "{{ .Env.WINGET_GITHUB_TOKEN }}"
      branch: "wallpy-{{ .Version }}"
      pull_request:
        enabled: true
        base: { owner: microsoft, name: winget-pkgs, branch: master }

aurs:
  - name: wallpy-bin
    # Off until the AUR account exists (registrations were closed on
    # 2026-10-27). To turn on: create the account, add ~/.ssh/aur.pub to it,
    # `gh secret set AUR_KEY < ~/.ssh/aur`, pass AUR_KEY in
    # .github/workflows/release.yml, and delete this line.
    disable: true
    homepage: https://wallpy.siphyshu.me
    description: Dynamic wallpapers for your desktop.
    maintainers: ["Jaiyank Saxena <siphyshu@gmail.com>"]
    license: MIT
    private_key: "{{ .Env.AUR_KEY }}"
    git_url: ssh://aur@aur.archlinux.org/wallpy-bin.git
    package: |-
      install -Dm755 ./wallpy "${pkgdir}/usr/bin/wallpy"
      install -Dm644 ./completions/wallpy.bash "${pkgdir}/usr/share/bash-completion/completions/wallpy"
      install -Dm644 ./completions/_wallpy "${pkgdir}/usr/share/zsh/site-functions/_wallpy"
      install -Dm644 ./completions/wallpy.fish "${pkgdir}/usr/share/fish/vendor_completions.d/wallpy.fish"
      install -Dm644 ./manpages/wallpy.1.gz "${pkgdir}/usr/share/man/man1/wallpy.1.gz"
